name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=#9b79e7
            assets/snake-dark.svg?palette=github-dark&color_snake=#b79af7
      - name: Save snake animation
        run: |
          if [ -n "$(git status --porcelain -- assets/snake-light.svg assets/snake-dark.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/snake-light.svg assets/snake-dark.svg
            git commit -m "Update contribution snake animation"
            git pull --rebase origin main
            git push
          fi
